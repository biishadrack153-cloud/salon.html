<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jas Nails and Lashes</title>
<style>
:root{--bg:#fff6f3;--surface:#fff;--ink:#2a0c17;--muted:#755860;--accent:#9e1b45;--accent-ink:#fff;--gold:#b8863a;--soft:#fbe4e3;--line:#efd3d1;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0a12;--surface:#2a1220;--ink:#fbeaea;--muted:#c9a9b1;--accent:#f08aa8;--accent-ink:#2a0c17;--gold:#e2b36a;--soft:#38192a;--line:#4b2538;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0a12;--surface:#2a1220;--ink:#fbeaea;--muted:#c9a9b1;--accent:#f08aa8;--accent-ink:#2a0c17;--gold:#e2b36a;--soft:#38192a;--line:#4b2538;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.05;margin:0}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.hero{position:relative;min-height:88svh;display:flex;color:#fff;overflow:hidden;background:#3a0f22}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,12,23,.55) 0%,rgba(42,12,23,.25) 35%,rgba(42,12,23,.88) 100%)}
.hero-in{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 36px;display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.8rem;font-weight:700;text-decoration:none;color:#fff}
nav a{margin-left:14px;text-decoration:none;color:#fff;font-size:.95rem;opacity:.92}
.welcome{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.7rem;color:#f3d29a;margin:0}
.hero h1{font-size:clamp(3.2rem,15vw,5.6rem);margin:4px 0 14px}
.sub{max-width:34ch;font-size:1.1rem;margin:0 0 24px;color:#fbeaea}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 26px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.hero .btn{background:#f3d29a;color:#2a0c17}
.hero .btn.alt{background:transparent;color:#fff;border:2px solid #f3d29a}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.avail{margin:20px 0 0;font-size:.95rem;color:#f3d29a}
section{padding:52px 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
section h2{font-size:2.4rem;margin-bottom:22px;color:var(--accent)}
.menu{list-style:none;margin:0;padding:0}
.menu li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line)}
.menu b{display:block;font-size:1.1rem}
.menu small{color:var(--muted)}
.price{font-weight:800;white-space:nowrap;color:var(--gold)}
.grp{font-size:1.7rem;margin:10px 0 0}.note{background:var(--soft);border-radius:16px;padding:16px 18px;margin:22px 0 0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;display:block;background:var(--soft)}
@media(min-width:620px){.gal{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr 1fr}}
form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.row{display:grid;gap:14px}
.err{color:var(--accent);font-size:.9rem;min-height:1.2em;margin:0}
#done{display:none;background:var(--soft);border-radius:22px;padding:24px}
#done h3{font-size:1.9rem;margin-bottom:8px;color:var(--accent)}
#sum{white-space:pre-line;color:var(--muted);margin:0 0 18px}
footer{padding:36px 0 48px;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}
footer a{color:var(--accent);font-weight:700}
</style></head><body>
